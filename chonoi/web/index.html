<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — v1.0.0</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/*
 * Quán Ăn Chợ Nổi — Live Client (v1.3 / Phase 4)
 * Điều khiển: WASD/Mũi tên = di chuyển · E = interact/cập bến · Space = bắt cá · C = Bật/tắt tương phản cao · R = chơi lại
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
let highContrast = false; // Chế độ tương phản cao

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (mode === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause: down.has("pause"), shop_done: down.has("shop_done") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "1") { fetch("/input", { method: "POST", body: JSON.stringify({ buy: "oxygen" }), headers: { "Content-Type": "application/json" } }); }
  else if (k === "2") { fetch("/input", { method: "POST", body: JSON.stringify({ buy: "hp" }), headers: { "Content-Type": "application/json" } }); }
  else if (k === "c") { highContrast = !highContrast; }
  else if (k === "p" || k === "escape") down.add("pause");
  else if (k === "o") down.add("shop_done");
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "p" || k === "escape") down.delete("pause");
  else if (k === "o") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

cv.addEventListener("click", (e) => {
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  // Bấm nút tương phản cao góc trên phải
  if (x >= innerWidth - 210 && x <= innerWidth - 10 && y >= 10 && y <= 40) {
    highContrast = !highContrast;
  }
});

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- đồ họa ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

const SFX_MAP = {
  dive: "Tõm! Út Sen lặn xuống nước",
  surface: "Ào! Út Sen ngoi lên mặt nước",
  fish_caught: "Quẫy quẫy! Bắt được cá!",
  gather: "Soạt! Hái rau dại",
  choke: "Khẹc! Khó thở vì hết oxy!",
  monster_hit: "RẦM! Cá sấu đớp trúng Út Sen!",
  cook_started: "Xèo xèo! Bắt đầu nấu món",
  dish_ready: "Tinh! Món ăn đã chín",
  dish_picked: "Lách cách! Đã bưng món nóng",
  served: "Cạch! Phục vụ món cho khách",
  paid: "Keng keng! Khách thanh toán tiền",
  customer_left: "Hừm! Khách bực tức bỏ về!",
  spoiled: "Chua lè! Nguyên liệu đã ươn (< 30%)!"
};

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.weight || (highContrast ? "bold " : "")) + (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || (highContrast ? "#ffff00" : "#e8eef2");
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = highContrast ? "#000000" : "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,.5)"; ctx.lineWidth = highContrast ? 2 : 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center", color: highContrast ? "#ffffff" : "#fff" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 60 ? s.slice(0, 57) + "…" : s; } catch (e) { return ""; }
}
function eventLog(w, h) {
  const ev = (snap.events || []).slice(-5);
  ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 70 - (ev.length - 1 - i) * 15, { size: 11, align: "right", color: highContrast ? "#ffff00" : "rgba(232,238,242,.75)" }));
}
function drawSfxSubtitle(w, h) {
  if (!snap || !snap.events) return;
  const nowTick = snap.tick || 0;
  const ev = [...(snap.events || [])].reverse().find(e => SFX_MAP[e.name]);
  if (ev && (nowTick - ev.tick) <= 150) {
    const sfx = SFX_MAP[ev.name];
    const txt = `🔊 [SFX: ${sfx}]`;
    const boxW = Math.max(280, txt.length * 8.5 + 40);
    ctx.fillStyle = highContrast ? "#000000" : "rgba(10, 20, 30, 0.85)";
    ctx.fillRect(w / 2 - boxW / 2, h - 85, boxW, 26);
    ctx.strokeStyle = highContrast ? "#ffff00" : "#4fc3f7";
    ctx.lineWidth = highContrast ? 2 : 1;
    ctx.strokeRect(w / 2 - boxW / 2, h - 85, boxW, 26);
    text(txt, w / 2, h - 68, { size: 12, align: "center", color: highContrast ? "#ffff00" : "#b3e5fc" });
  }
}
function overlay(w, h) {
  // Nút tương phản cao góc trên phải
  ctx.fillStyle = highContrast ? "#ffff00" : "rgba(255,255,255,.15)";
  ctx.fillRect(w - 200, 10, 190, 28);
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,.3)";
  ctx.lineWidth = 2;
  ctx.strokeRect(w - 200, 10, 190, 28);
  text(highContrast ? "👁 Tương phản cao: [BẬT] (C)" : "👁 Tương phản cao: [TẮT] (C)", w - 105, 29, { size: 11, align: "center", color: highContrast ? "#000000" : "#ffffff" });

  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap && snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap && snap.finished) {
    ctx.fillStyle = highContrast ? "#000000" : "rgba(0,0,0,.65)";
    ctx.fillRect(w / 2 - 200, h / 2 - 50, 400, 100);
    ctx.strokeStyle = highContrast ? "#ffff00" : "#ffffff";
    ctx.strokeRect(w / 2 - 200, h / 2 - 50, 400, 100);
    text("Buổi " + (snap.mode === "gather" ? "sáng" : "tối") + " kết thúc: " + (snap.reason || ""), w / 2, h / 2 - 12, { align: "center", size: 20, color: highContrast ? "#ffff00" : "#fff" });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 20, { align: "center", color: "#cfd8dc" });
  }
}

// ----- cảnh GATHER -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

  // Trời + Nước
  ctx.fillStyle = highContrast ? "#000000" : "#cfeaf5";
  ctx.fillRect(0, top, w, SKY * s);
  if (highContrast) {
    ctx.fillStyle = "#001122";
    ctx.fillRect(sx(0), oy, X * s, D * s);
    ctx.strokeStyle = "#00ffff";
    ctx.lineWidth = 3;
    ctx.strokeRect(sx(0), oy, X * s, D * s);
  } else {
    const g = ctx.createLinearGradient(0, oy, 0, sy(D));
    g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
    ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
    ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  }

  // Vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = highContrast ? "rgba(255,255,255,.3)" : "rgba(255,255,255,.08)";
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: highContrast ? "#ffffff" : "rgba(255,255,255,.4)" });
  }

  // Bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = highContrast ? "#ffffff" : "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = highContrast ? "#ffff00" : "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = highContrast ? "#ffff00" : "rgba(255,230,150,.7)"; ctx.lineWidth = highContrast ? 3 : 1;
  ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: highContrast ? "#ffff00" : "#5a3a22" });

  // Nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = highContrast ? "#ffff00" : kc(n.kind);
    ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: highContrast ? "#ffffff" : "#234" });
  });

  // Đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = highContrast ? "#00ffff" : kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: highContrast ? "#00ffff" : "rgba(255,255,255,.8)" });
  });

  // Thủy quái (Cá Sấu Năm Chèo)
  (snap.monsters || []).forEach((m) => {
    ctx.save(); ctx.translate(sx(m.pos[0]), sy(m.pos[1]));
    const isChasing = m.state === "chase";
    ctx.fillStyle = highContrast ? (isChasing ? "#ff0000" : "#ff5555") : (isChasing ? "#c62828" : "#2e7d32");
    // Thân cá sấu
    ctx.beginPath(); ctx.ellipse(0, 0, 1.8 * s, 0.7 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke(); }
    // Mõm và mắt đỏ rực
    ctx.fillStyle = isChasing ? "#ffff00" : "#ffffff";
    ctx.beginPath(); ctx.arc(1.2 * s, -0.2 * s, 0.25 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff1744"; ctx.beginPath(); ctx.arc(1.25 * s, -0.2 * s, 0.12 * s, 0, Math.PI * 2); ctx.fill();
    // Gai lưng
    ctx.fillStyle = highContrast ? "#ffffff" : "#1b5e20";
    for (let gx = -1.2 * s; gx <= 1.0 * s; gx += 0.4 * s) {
      ctx.beginPath(); ctx.moveTo(gx, -0.6 * s); ctx.lineTo(gx + 0.2 * s, -1.0 * s); ctx.lineTo(gx + 0.4 * s, -0.6 * s); ctx.fill();
    }
    ctx.restore();
    text(isChasing ? "🐊 CÁ SẤU ĐANG ĐUỔI!" : "🐊 Cá Sấu " + m.id, sx(m.pos[0]), sy(m.pos[1]) - 1.2 * s, {
      size: isChasing ? 12 : 10, align: "center", color: isChasing ? "#ff5252" : "#a5d6a7"
    });
  });

  // Người chơi (Út Sen)
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) {
      ctx.strokeStyle = highContrast ? "#00ffff" : "rgba(255,255,255,.25)";
      ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (meta.interact_radius && !underwater) {
      ctx.strokeStyle = highContrast ? "#ffff00" : "rgba(255,255,255,.35)";
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = highContrast ? "#ffff00" : "#ff8a3d";
      ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      if (highContrast) { ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; ctx.stroke(); }
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = highContrast ? "#ffffff" : "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }

  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : (highContrast ? "#00ffff" : "#4fc3f7"), "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: highContrast ? "#ff0055" : "#ff6b81" });
  }

  // ===== CẢNH BÁO 1: THỦY QUÁI GẦN / ĐANG ĐUỔI =====
  const nearMonster = (snap.monsters || []).find(m => {
    if (!p) return false;
    return m.state === "chase" || Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= 10.0;
  });
  if (nearMonster) {
    const isBlink = Math.floor(Date.now() / 250) % 2 === 0;
    const bg = highContrast ? (isBlink ? "#ffff00" : "#ff0000") : "rgba(220, 20, 60, 0.9)";
    const fg = highContrast ? (isBlink ? "#000000" : "#ffffff") : "#ffffff";
    ctx.fillStyle = bg; ctx.fillRect(w / 2 - 210, 8, 420, 32);
    ctx.strokeStyle = highContrast ? "#ffffff" : "#ffcdd2"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - 210, 8, 420, 32);
    text("⚠️ CẢNH BÁO: THỦY QUÁI GẦN! CÁ SẤU ĐANG RƯỢT!", w / 2, 30, { size: 14, align: "center", color: fg });
  }

  // ===== CẢNH BÁO 2: OXY SẮP HẾT (dưới nước & <= 5s) =====
  if (p && p.oxygen_ticks !== undefined && p.oxygen_ticks <= 300 && p.pos[1] > 0.5) {
    const isBlink = Math.floor(Date.now() / 200) % 2 === 0;
    const bg = highContrast ? (isBlink ? "#ff0000" : "#ffff00") : "rgba(255, 69, 0, 0.9)";
    const fg = highContrast ? (isBlink ? "#ffffff" : "#000000") : "#ffffff";
    ctx.fillStyle = bg; ctx.fillRect(w / 2 - 210, 44, 420, 30);
    ctx.strokeStyle = highContrast ? "#ffffff" : "#ffebee"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - 210, 44, 420, 30);
    const sLeft = Math.ceil(p.oxygen_ticks / 60);
    text(`💨 OXY SẮP HẾT: CÒN ${sLeft}s! NGOI LÊN GẤP!`, w / 2, 65, { size: 13, align: "center", color: fg });
  }

  // Giỏ hàng
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(34, (w - 260) / cap - 4), y0 = h - bottom + 6;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = highContrast ? "#222222" : "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.strokeRect(x0, y0, sz, sz); }
      const it = snap.hold[i];
      if (it) {
        const k = typeof it === "string" ? it : it.kind;
        const fr = (typeof it === "object" && it.fresh !== undefined) ? it.fresh : 100;
        const isSpoiled = fr < 30;
        ctx.fillStyle = isSpoiled ? (highContrast ? "#ff0000" : "#546e7a") : (highContrast ? "#ffff00" : kc(k));
        ctx.fillRect(x0 + 2, y0 + 2, sz - 4, sz - 4);
        if (typeof it === "object") {
          ctx.font = "bold 9px system-ui";
          ctx.fillStyle = isSpoiled ? "#ffffff" : (highContrast ? "#000000" : "#ffffff");
          ctx.textAlign = "center";
          ctx.fillText(isSpoiled ? "ƯƠN" : Math.round(fr) + "%", x0 + sz / 2, y0 + sz - 2);
        }
      }
    }
    const freshCount = snap.hold.filter(it => (typeof it === "object" ? it.fresh >= 30 : true)).length;
    const spoiledCount = snap.hold.length - freshCount;
    text(`Giỏ ${snap.hold.length}/${cap} (Tươi: ${freshCount}, Ươn: ${spoiledCount})`, 14, y0 + sz + 14, { size: 12, color: highContrast ? "#ffff00" : "#cfd8dc" });
  }
  text("WASD bơi · E hái/cập bến · Space bắt cá · C tương phản · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: highContrast ? "#ffff00" : "#9fb3c0" });
}

// ----- cảnh QUÁN -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  ctx.fillStyle = highContrast ? "#000000" : "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = highContrast ? "#ffffff" : "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  // Bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? (highContrast ? "#ffff00" : "#e8892b") : st.state === "ready" ? (highContrast ? "#00ff00" : "#6fbf5a") : (highContrast ? "#333333" : "#6d6d72");
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s); }
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: highContrast ? "#ffffff" : "#111" });
    if (st.dish) text(st.dish, sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 10, align: "center", color: highContrast ? "#ffff00" : "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.25 * s, { size: 11, align: "center", color: highContrast ? "#ffff00" : "#2a1a0a" });
  });

  // Bàn + Khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = highContrast ? "#222222" : "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke(); }
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? (highContrast ? "#00ff00" : "#7bc67b") : (highContrast ? "#ff00ff" : "#f4b6c2");
      ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(c.dish_id || "?", cx, cy - 0.75 * s, { size: 10, align: "center", color: highContrast ? "#ffffff" : "#2a1a0a" });
      if (c.patience_ticks_left !== undefined) bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, c.patience_ticks_left / patMax, "#e57373");
    }
  });

  // Người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = highContrast ? "#00ffff" : "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = highContrast ? "#ffff00" : "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + hand, px, py - 0.8 * s, { size: 11, align: "center", color: highContrast ? "#ffff00" : "#2a1a0a" });
    }
  }

  // ===== CẢNH BÁO 3: KHÁCH SẮP GIẬN =====
  const angryCust = (snap.customers || []).find(c => c.state === "waiting" && c.patience_ticks_left !== undefined && c.patience_ticks_left <= 0.25 * patMax);
  if (angryCust) {
    const isBlink = Math.floor(Date.now() / 250) % 2 === 0;
    const bg = highContrast ? (isBlink ? "#ffff00" : "#ff0000") : "rgba(211, 47, 47, 0.9)";
    const fg = highContrast ? (isBlink ? "#000000" : "#ffffff") : "#ffffff";
    ctx.fillStyle = bg; ctx.fillRect(w / 2 - 210, 8, 420, 32);
    ctx.strokeStyle = highContrast ? "#ffffff" : "#ffcdd2"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - 210, 8, 420, 32);
    const sLeft = Math.ceil(angryCust.patience_ticks_left / 60);
    text(`😡 CẢNH BÁO: KHÁCH BÀN ${angryCust.table_id} SẮP HẾT KIÊN NHẪN (${sLeft}s)!`, w / 2, 30, { size: 13, align: "center", color: fg });
  }

  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  let stockStr = "";
  if (Array.isArray(snap.stock)) {
    stockStr = snap.stock.map(it => {
      const isSpoiled = it.fresh < 30;
      const status = isSpoiled ? " [ƯƠN]" : ` [${Math.round(it.fresh)}%]`;
      return `${KIND_NAME[it.kind] || it.kind}${status}`;
    }).join(", ");
  } else if (snap.stock) {
    stockStr = Object.keys(snap.stock).map((k) => (KIND_NAME[k] || k) + "×" + snap.stock[k]).join(", ");
  }
  text("Kho: " + (stockStr || "(trống)"), 14, 52, { size: 13, color: highContrast ? "#00ffff" : "#cfd8dc" });
  text("WASD đi · E nấu/giao · C tương phản · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: highContrast ? "#ffff00" : "#9fb3c0" });
}

// ----- cảnh SHOP -----
function drawShop(w, h) {
  text("🏪 TIỆM TẠP HÓA ÚT SEN — SHOP NÂNG CẤP CUỐI NGÀY", w / 2, 80, { size: 22, align: "center", color: highContrast ? "#ffff00" : "#f2c230" });
  text(`Tiền: ${snap.money ?? 0} k  ·  Tổng thu: ${snap.earned ?? 0} k  ·  Uy tín: ${(snap.reputation ?? 0).toFixed(1)}`, w / 2, 120, { size: 16, align: "center" });

  const oxyLvl = snap.upgrades ? (snap.upgrades.oxygen || 0) : 0;
  const hpLvl = snap.upgrades ? (snap.upgrades.hp || 0) : 0;

  ctx.fillStyle = highContrast ? "#111111" : "rgba(255,255,255,0.06)";
  ctx.fillRect(w / 2 - 240, 160, 480, 80);
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,0.2)";
  ctx.strokeRect(w / 2 - 240, 160, 480, 80);
  text(`1. Bình Oxy — Cấp hiện tại: ${oxyLvl} / 2`, w / 2 - 220, 190, { size: 16 });
  const oxyPrice = oxyLvl === 0 ? "200 k (nâng lên 45s)" : (oxyLvl === 1 ? "400 k (nâng lên 60s)" : "ĐÃ TỐI ĐA");
  text(`[Phím 1] để nâng cấp: ${oxyPrice}`, w / 2 - 220, 220, { size: 13, color: oxyLvl < 2 ? (highContrast ? "#00ffff" : "#d6e6f2") : "#888" });

  ctx.fillRect(w / 2 - 240, 260, 480, 80);
  ctx.strokeRect(w / 2 - 240, 260, 480, 80);
  text(`2. Áo phao (Thêm Máu) — Cấp hiện tại: ${hpLvl} / 2`, w / 2 - 220, 290, { size: 16 });
  const hpPrice = hpLvl === 0 ? "250 k (nâng lên 4 Máu)" : (hpLvl === 1 ? "500 k (nâng lên 5 Máu)" : "ĐÃ TỐI ĐA");
  text(`[Phím 2] để nâng cấp: ${hpPrice}`, w / 2 - 220, 320, { size: 13, color: hpLvl < 2 ? (highContrast ? "#ff00ff" : "#e8799c") : "#888" });

  text(`⏱ Thời gian còn: ${fmtTime(snap.time_left_ticks)}`, w / 2, 380, { size: 15, align: "center" });
  text("👉 Bấm phím [O] để đóng Shop và sang ngày tiếp theo!", w / 2, 420, { size: 16, align: "center", color: highContrast ? "#00ff00" : "#8fcf6b" });
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = highContrast ? "#000000" : "#10161c";
  ctx.fillRect(0, 0, w, h);
  if (snap) {
    const phase = snap.phase || snap.mode;
    if (phase === "quan") drawQuan(w, h);
    else if (phase === "shop") drawShop(w, h);
    else drawGather(w, h);
    eventLog(w, h);
    drawSfxSubtitle(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
