<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — v1.0.0 Pro Edition</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c1218; color: #e8eef2; font: 14px/1.4 system-ui, -apple-system, sans-serif; overflow: hidden; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #modal-lb {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
    justify-content: center; align-items: center; z-index: 100;
  }
  .modal-box {
    background: #141f2b; border: 2px solid #f2c230; border-radius: 12px;
    padding: 24px 32px; width: 520px; max-width: 90%; color: #fff;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6);
  }
  .modal-box h2 { margin: 0 0 16px; color: #f2c230; text-align: center; font-size: 20px; }
  .lb-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
  .lb-table th { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.2); color: #90caf9; }
  .lb-table td { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .lb-close {
    display: block; width: 100%; padding: 10px; background: #263238; border: 1px solid #90caf9;
    border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; text-align: center;
  }
  .lb-close:hover { background: #37474f; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- Modal Bảng Xếp Hạng -->
<div id="modal-lb">
  <div class="modal-box">
    <h2>🏆 BẢNG VÀNG CAO THỦ CHỢ NỔI</h2>
    <table class="lb-table">
      <thead>
        <tr><th>Hạng</th><th>Tên</th><th>Điểm</th><th>Ngày</th><th>Seed</th></tr>
      </thead>
      <tbody id="lb-body">
        <tr><td colspan="5" style="text-align:center; color:#aaa;">Đang tải dữ liệu...</td></tr>
      </tbody>
    </table>
    <button class="lb-close" onclick="closeLeaderboard()">Đóng (ESC)</button>
  </div>
</div>

<script>
"use strict";
/*
 * Quán Ăn Chợ Nổi — Live Client Pro v1.0.0
 * Điều khiển: WASD = di chuyển · E = tương tác · Space = bắt cá · C = tương phản · M = âm thanh · R = chơi lại
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
let snap = null, offline = false;
let highContrast = false;
let audioEnabled = true;
let showHelp = false;
let showLeaderboard = false;

// ---------- Âm thanh Synthesizer (Web Audio API) ----------
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (AudioCtor) audioCtx = new AudioCtor();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type = "sine", gainVal = 0.15) {
  if (!audioEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    g.gain.setValueAtTime(gainVal, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(g);
    g.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function sfxDive() {
  if (!audioEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(280, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.25);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  } catch (e) {}
}

function sfxSurface() {
  if (!audioEnabled || !audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(360, audioCtx.currentTime + 0.2);
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  } catch (e) {}
}

function sfxCatch() {
  playTone(523, 0.1, "triangle", 0.2);
  setTimeout(() => playTone(784, 0.15, "triangle", 0.2), 60);
}

function sfxGather() {
  playTone(659, 0.08, "sine", 0.18);
  setTimeout(() => playTone(880, 0.12, "sine", 0.15), 50);
}

function sfxChoke() {
  playTone(85, 0.25, "sawtooth", 0.25);
}

function sfxMonsterHit() {
  playTone(65, 0.35, "sawtooth", 0.35);
}

function sfxCook() {
  playTone(330, 0.15, "square", 0.08);
}

function sfxReady() {
  playTone(1046, 0.2, "sine", 0.25);
  setTimeout(() => playTone(1318, 0.3, "sine", 0.2), 100);
}

function sfxServe() {
  playTone(220, 0.12, "triangle", 0.25);
}

function sfxPaid() {
  const notes = [523, 659, 784, 1046];
  notes.forEach((f, idx) => setTimeout(() => playTone(f, 0.15, "triangle", 0.2), idx * 50));
}

// BGM Đồng Quê Nam Bộ 8-bit lãng đãng
let bgmTimer = null, bgmStep = 0;
const BGM_NOTES = [261.6, 293.7, 349.2, 392.0, 440.0, 523.3, 440.0, 392.0, 349.2, 293.7];
function startBgm() {
  if (bgmTimer) return;
  bgmTimer = setInterval(() => {
    if (!audioEnabled || !audioCtx) return;
    const f = BGM_NOTES[bgmStep % BGM_NOTES.length];
    bgmStep++;
    playTone(f, 0.3, "sine", 0.04);
  }, 420);
}

// ---------- Hạt Đồ Họa (Particle System) ----------
const particles = [];
class Particle {
  constructor(x, y, vx, vy, life, type, color, size, text = "") {
    this.x = x; this.y = y; this.vx = vx; this.vy = vy;
    this.life = life; this.maxLife = life;
    this.type = type; this.color = color; this.size = size; this.text = text;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.life--;
    if (this.type === "bubble") {
      this.vx += (Math.random() - 0.5) * 0.05;
      this.vy -= 0.02;
    } else if (this.type === "smoke") {
      this.vy -= 0.03;
      this.vx += (Math.random() - 0.5) * 0.04;
    } else if (this.type === "text") {
      this.vy *= 0.95;
    }
  }
  draw(ctx) {
    const alpha = Math.max(0, this.life / this.maxLife);
    ctx.save();
    ctx.globalAlpha = alpha;
    if (this.type === "text") {
      ctx.font = "bold " + this.size + "px system-ui";
      ctx.fillStyle = this.color;
      ctx.textAlign = "center";
      ctx.fillText(this.text, this.x, this.y);
    } else {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function spawnBubble(x, y) {
  if (particles.length > 100) return;
  particles.push(new Particle(x, y, (Math.random() - 0.5) * 0.3, -0.6 - Math.random() * 0.6, 60 + Math.random() * 40, "bubble", "rgba(220, 245, 255, 0.6)", 2 + Math.random() * 2.5));
}
function spawnSmoke(x, y) {
  if (particles.length > 100) return;
  particles.push(new Particle(x, y, (Math.random() - 0.5) * 0.4, -0.8 - Math.random() * 0.4, 45, "smoke", "rgba(255, 180, 80, 0.5)", 3 + Math.random() * 3));
}
function spawnPopupText(x, y, txt, col = "#ffd54f") {
  particles.push(new Particle(x, y, 0, -1.2, 50, "text", col, 14, txt));
}

// ---------- Xử lý sự kiện âm thanh từ snapshot ----------
let processedEventCount = 0;
function handleNewEvents(events) {
  if (!events || events.length === 0) return;
  const newEvs = events.slice(processedEventCount);
  processedEventCount = events.length;
  newEvs.forEach((e) => {
    switch (e.name) {
      case "dive": sfxDive(); break;
      case "surface": sfxSurface(); break;
      case "fish_caught": sfxCatch(); break;
      case "gather": sfxGather(); break;
      case "choke": sfxChoke(); break;
      case "monster_hit": sfxMonsterHit(); break;
      case "cook_started": sfxCook(); break;
      case "dish_ready": sfxReady(); break;
      case "served": sfxServe(); break;
      case "paid":
        sfxPaid();
        if (e.data && e.data.earned !== undefined) {
          const tableX = window.innerWidth / 2, tableY = window.innerHeight / 2 - 30;
          spawnPopupText(tableX, tableY, `+${e.data.price || 0}k`, "#76ff03");
          if (e.data.tip) spawnPopupText(tableX, tableY - 20, `+${e.data.tip}k (boa ⭐)`, "#ffd600");
        }
        break;
      case "bought": sfxPaid(); break;
    }
  });
}

// ---------- Vào: Bàn phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? (snap.phase || snap.mode) : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);
  if (mode === "quan") dy = -dy;
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause: down.has("pause"), shop_done: down.has("shop_done") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) {}
  }
  inflight = false;
}
function keyName(e) { return e.key.toLowerCase(); }

addEventListener("keydown", (e) => {
  initAudio();
  startBgm();
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "1") { fetch("/input", { method: "POST", body: JSON.stringify({ buy: "oxygen" }), headers: { "Content-Type": "application/json" } }); }
  else if (k === "2") { fetch("/input", { method: "POST", body: JSON.stringify({ buy: "hp" }), headers: { "Content-Type": "application/json" } }); }
  else if (k === "c") { highContrast = !highContrast; }
  else if (k === "m") { audioEnabled = !audioEnabled; }
  else if (k === "h") { showHelp = !showHelp; }
  else if (k === "p" || k === "escape") {
    if (showLeaderboard) closeLeaderboard();
    else down.add("pause");
  }
  else if (k === "o") down.add("shop_done");
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); particles.length = 0; }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  else if (k === "p" || k === "escape") down.delete("pause");
  else if (k === "o") down.delete("shop_done");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

cv.addEventListener("click", (e) => {
  initAudio();
  startBgm();
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const w = window.innerWidth;
  // Nút tương phản cao
  if (x >= w - 170 && x <= w - 10 && y >= 10 && y <= 36) { highContrast = !highContrast; }
  // Nút âm thanh
  else if (x >= w - 310 && x <= w - 180 && y >= 10 && y <= 36) { audioEnabled = !audioEnabled; }
  // Nút Bảng xếp hạng
  else if (x >= w - 460 && x <= w - 320 && y >= 10 && y <= 36) { openLeaderboard(); }
  // Nút Trợ giúp
  else if (x >= w - 540 && x <= w - 470 && y >= 10 && y <= 36) { showHelp = !showHelp; }
});

// ---------- Ra: Poll Snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    if (snap && snap.events) handleNewEvents(snap.events);
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- Bảng Xếp Hạng Modal ----------
async function openLeaderboard() {
  showLeaderboard = true;
  document.getElementById("modal-lb").style.display = "flex";
  const tbody = document.getElementById("lb-body");
  try {
    const res = await fetch("/leaderboard");
    const data = await res.json();
    const entries = data.entries || [];
    if (entries.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#aaa;">Chưa có lượt chơi nào đủ 5 Ngày chuẩn!</td></tr>';
    } else {
      tbody.innerHTML = entries.map((it, idx) => {
        const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx + 1}`;
        return `<tr>
          <td><strong>${medal}</strong></td>
          <td>${it.name}</td>
          <td style="color:#ffd54f; font-weight:bold;">${it.score}</td>
          <td>${it.days_completed} ngày</td>
          <td style="color:#90caf9;">${it.seed}</td>
        </tr>`;
      }).join("");
    }
  } catch (e) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#ff8a80;">Không tải được bảng xếp hạng!</td></tr>';
  }
}
function closeLeaderboard() {
  showLeaderboard = false;
  document.getElementById("modal-lb").style.display = "none";
}

// ---------- Đồ họa & Canvas ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.weight || (highContrast ? "bold " : "")) + (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || (highContrast ? "#ffff00" : "#e8eef2");
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = highContrast ? "#000000" : "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = highContrast ? "#ffffff" : "rgba(255,255,255,.5)"; ctx.lineWidth = highContrast ? 2 : 1;
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center", color: highContrast ? "#ffffff" : "#fff" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function brief(d) {
  try { const s = JSON.stringify(d); return s.length > 55 ? s.slice(0, 52) + "…" : s; } catch (e) { return ""; }
}

// Vẽ nhân vật Út Sen đội nón lá đặc trưng Nam Bộ
function drawUtSen(x, y, headingDeg, s, isDiving, invuln) {
  if (invuln && Math.floor(Date.now() / 80) % 2) return;
  ctx.save();
  ctx.translate(x, y);
  const rad = (headingDeg * Math.PI) / 180;
  ctx.rotate(rad);

  // Thân áo bà ba
  ctx.fillStyle = highContrast ? "#ffff00" : "#ff7043";
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.65 * s, 0.45 * s, 0, 0, Math.PI * 2);
  ctx.fill();
  if (highContrast) { ctx.strokeStyle = "#000"; ctx.lineWidth = 2; ctx.stroke(); }

  // Khăn rằn caro Nam Bộ quàng cổ
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(-0.2 * s, -0.15 * s, 0.4 * s, 0.1 * s);
  ctx.fillStyle = "#263238";
  ctx.fillRect(-0.1 * s, -0.15 * s, 0.1 * s, 0.1 * s);

  // Nón lá chóp vàng
  ctx.fillStyle = highContrast ? "#ffffff" : "#fbc02d";
  ctx.beginPath();
  ctx.moveTo(0.3 * s, 0);
  ctx.lineTo(-0.4 * s, -0.55 * s);
  ctx.lineTo(-0.4 * s, 0.55 * s);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = highContrast ? "#000" : "#c49000";
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Đỉnh nón lá
  ctx.fillStyle = "#8d6e63";
  ctx.beginPath();
  ctx.arc(-0.4 * s, 0, 0.1 * s, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ----- Ca Sáng: Lặn & Hái (GATHER) -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

  // Trời & Dòng sông Tiền
  ctx.fillStyle = highContrast ? "#000000" : "#d0f0fd"; ctx.fillRect(0, top, w, SKY * s);
  if (highContrast) {
    ctx.fillStyle = "#001122"; ctx.fillRect(sx(0), oy, X * s, D * s);
    ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 3; ctx.strokeRect(sx(0), oy, X * s, D * s);
  } else {
    const g = ctx.createLinearGradient(0, oy, 0, sy(D));
    g.addColorStop(0, "#42a5f5"); g.addColorStop(0.4, "#1976d2"); g.addColorStop(1, "#07203d");
    ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
    // Vệt sóng nước
    ctx.strokeStyle = "#e1f5fe"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  }

  // Vạch đo độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = highContrast ? "rgba(255,255,255,.3)" : "rgba(255,255,255,.1)";
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + "m", sx(0) + 4, sy(d) - 2, { size: 10, color: highContrast ? "#fff" : "rgba(255,255,255,.45)" });
  }

  // Bến tàu Rạch Sen
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = highContrast ? "#ffffff" : "#8d6e63"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.8), 3 * s, 1.0 * s);
  ctx.fillStyle = highContrast ? "#ffff00" : "#d32f2f"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.8)); ctx.lineTo(sx(dp[0]), sy(-2.5)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.8)); ctx.fill();
  ctx.strokeStyle = highContrast ? "#ffff00" : "#ffca28"; ctx.lineWidth = highContrast ? 3 : 1.5;
  ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("📍 BẾN TÀU (E CẬP BẾN)", sx(dp[0]), sy(-2.9), { size: 11, align: "center", color: highContrast ? "#ffff00" : "#ffe082" });

  // Nút hái hoa
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = highContrast ? "#ffff00" : kc(n.kind);
    ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.15 * s, 0.95 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.globalAlpha = 1;
    text(KIND_NAME[n.kind] || n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.75 * s, { size: 10, align: "center", color: highContrast ? "#fff" : "#fff" });
  });

  // Đàn cá bơi
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = highContrast ? "#00ffff" : kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.stroke(); }
    ctx.restore();
    text(KIND_NAME[f.kind] || f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 9, align: "center", color: highContrast ? "#00ffff" : "rgba(255,255,255,.8)" });
  });

  // Thủy quái Cá Sấu Năm Chèo
  (snap.monsters || []).forEach((m) => {
    ctx.save(); ctx.translate(sx(m.pos[0]), sy(m.pos[1]));
    const isChasing = m.state === "chase";
    ctx.fillStyle = highContrast ? (isChasing ? "#ff0000" : "#ff5555") : (isChasing ? "#b71c1c" : "#2e7d32");
    ctx.beginPath(); ctx.ellipse(0, 0, 1.9 * s, 0.75 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (highContrast) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
    // Mắt đỏ rực
    ctx.fillStyle = isChasing ? "#ffff00" : "#ffffff"; ctx.beginPath(); ctx.arc(1.3 * s, -0.2 * s, 0.25 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ff1744"; ctx.beginPath(); ctx.arc(1.35 * s, -0.2 * s, 0.12 * s, 0, Math.PI * 2); ctx.fill();
    // Gai lưng
    ctx.fillStyle = highContrast ? "#ffffff" : "#1b5e20";
    for (let gx = -1.3 * s; gx <= 1.0 * s; gx += 0.45 * s) {
      ctx.beginPath(); ctx.moveTo(gx, -0.65 * s); ctx.lineTo(gx + 0.22 * s, -1.05 * s); ctx.lineTo(gx + 0.45 * s, -0.65 * s); ctx.fill();
    }
    ctx.restore();
    text(isChasing ? "🐊 CÁ SẤU ĐANG RƯỢT!" : "🐊 Cá Sấu Năm Chèo", sx(m.pos[0]), sy(m.pos[1]) - 1.25 * s, {
      size: isChasing ? 12 : 10, align: "center", color: isChasing ? "#ff5252" : "#a5d6a7"
    });
  });

  // Người chơi Út Sen
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (underwater && Math.random() < 0.2) spawnBubble(px, py);

    if (meta.catch_radius && underwater) {
      ctx.strokeStyle = highContrast ? "#00ffff" : "rgba(255,255,255,.25)";
      ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    if (meta.interact_radius && !underwater) {
      ctx.strokeStyle = highContrast ? "#ffff00" : "rgba(255,255,255,.35)";
      ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke();
    }
    drawUtSen(px, py, p.heading_deg || 0, s, underwater, p.invuln_ticks > 0);

    // La bàn chỉ hướng Bến tàu nếu ở xa
    if (p.pos[0] > 7) {
      const distToDock = Math.round(p.pos[0] - 2);
      const isUrgent = snap.time_left_ticks <= 1800; // Còn dưới 30s
      ctx.fillStyle = isUrgent ? (Math.floor(Date.now() / 200) % 2 ? "#ff1744" : "#b71c1c") : "rgba(20, 40, 60, 0.85)";
      ctx.fillRect(px - 60, py - 1.8 * s, 120, 22);
      ctx.strokeStyle = "#fbc02d"; ctx.strokeRect(px - 60, py - 1.8 * s, 120, 22);
      text(`🧭 Về Bến: ${distToDock}m ⬅`, px, py - 1.8 * s + 15, { size: 11, align: "center", color: "#fff" });
    }
  }

  // HUD Trên: Thời gian, Oxy, Máu
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : (highContrast ? "#00ffff" : "#4fc3f7"), "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥ " : "♡ ";
    text(hs, 345, 29, { size: 22, color: highContrast ? "#ff0055" : "#ff5252" });
  }

  // Cảnh báo 1: Thủy quái gần
  const nearMonster = (snap.monsters || []).find(m => p && (m.state === "chase" || Math.hypot(m.pos[0] - p.pos[0], m.pos[1] - p.pos[1]) <= 10.0));
  if (nearMonster) {
    const isBlink = Math.floor(Date.now() / 200) % 2 === 0;
    ctx.fillStyle = isBlink ? "#d50000" : "#ff1744"; ctx.fillRect(w / 2 - 220, 8, 440, 32);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - 220, 8, 440, 32);
    text("⚠️ CẢNH BÁO: THỦY QUÁI GẦN! CÁ SẤU ĐANG RƯỢT!", w / 2, 30, { size: 14, align: "center", color: "#fff" });
  }

  // Cảnh báo 2: Oxy nguy cấp
  if (p && p.oxygen_ticks !== undefined && p.oxygen_ticks <= 300 && p.pos[1] > 0.5) {
    const isBlink = Math.floor(Date.now() / 200) % 2 === 0;
    ctx.fillStyle = isBlink ? "#ff6d00" : "#ff3d00"; ctx.fillRect(w / 2 - 220, 44, 440, 30);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - 220, 44, 440, 30);
    text(`💨 OXY SẮP HẾT: CÒN ${Math.ceil(p.oxygen_ticks / 60)}s! NGOI LÊN GẤP!`, w / 2, 65, { size: 13, align: "center", color: "#fff" });
  }

  // Giỏ hàng với độ tươi
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(34, (w - 260) / cap - 4), y0 = h - bottom + 6;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = highContrast ? "#222" : "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      const it = snap.hold[i];
      if (it) {
        const k = typeof it === "string" ? it : it.kind;
        const fr = (typeof it === "object" && it.fresh !== undefined) ? it.fresh : 100;
        const isSpoiled = fr < 30;
        ctx.fillStyle = isSpoiled ? "#b0bec5" : kc(k);
        ctx.fillRect(x0 + 2, y0 + 2, sz - 4, sz - 4);
        ctx.font = "bold 9px system-ui";
        ctx.fillStyle = isSpoiled ? "#d50000" : "#ffffff";
        ctx.textAlign = "center";
        ctx.fillText(isSpoiled ? "ƯƠN" : Math.round(fr) + "%", x0 + sz / 2, y0 + sz - 3);
      }
    }
    const freshCount = snap.hold.filter(it => (typeof it === "object" ? it.fresh >= 30 : true)).length;
    text(`Giỏ hàng ${snap.hold.length}/${cap} (Tươi: ${freshCount}, Ươn: ${snap.hold.length - freshCount})`, 14, y0 + sz + 14, { size: 12, color: "#cfd8dc" });
  }
}

// ----- Ca Tối: Quán Ăn Nổi (QUAN) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 45;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  // Sàn bè tre gỗ miền Tây
  ctx.fillStyle = highContrast ? "#000000" : "#d7ccc8"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = highContrast ? "#ffffff" : "#5d4037"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // Các đường rãnh ván gỗ
  if (!highContrast) {
    ctx.strokeStyle = "rgba(93, 64, 55, 0.25)";
    ctx.lineWidth = 1;
    for (let z = 1; z < Z; z++) {
      ctx.beginPath(); ctx.moveTo(sx(0), sy(z)); ctx.lineTo(sx(X), sy(z)); ctx.stroke();
    }
  }

  // Phân khu
  text("🔥 KHU BẾP NẤU", sx(3.5), sy(9.6), { size: 12, align: "center", color: highContrast ? "#fff" : "#8d6e63" });
  text("🪑 KHU BÀN ĂN THỰC KHÁCH", sx(11), sy(9.6), { size: 12, align: "center", color: highContrast ? "#fff" : "#8d6e63" });

  // Bếp nấu B1, B2 (vẽ lò đất nung, lửa bốc khói khi nấu)
  (snap.stoves || []).forEach((st) => {
    const isCooking = st.state === "cooking";
    const isReady = st.state === "ready";
    const bx = sx(st.pos[0]), by = sy(st.pos[1]);
    const bw = 1.7 * s;

    if (isCooking && Math.random() < 0.4) spawnSmoke(bx, by - 0.8 * s);

    // Lò nung
    ctx.fillStyle = isCooking ? "#d84315" : isReady ? "#2e7d32" : (highContrast ? "#333" : "#455a64");
    ctx.fillRect(bx - bw / 2, by - bw / 2, bw, bw);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.8;
    ctx.strokeRect(bx - bw / 2, by - bw / 2, bw, bw);

    // Miệng nồi
    ctx.fillStyle = isCooking ? "#ff7043" : isReady ? "#66bb6a" : "#78909c";
    ctx.beginPath(); ctx.arc(bx, by, bw * 0.32, 0, Math.PI * 2); ctx.fill();

    const stoveLabel = st.id + (isReady ? " (ĐÃ CHÍN ⭐)" : isCooking ? " (ĐANG NẤU)" : " (BẾP RẢNH)");
    text(stoveLabel, bx, by - bw * 0.58, { size: 11, align: "center", color: isReady ? "#a5d6a7" : isCooking ? "#ffcc80" : "#ffffff" });

    if (st.dish) {
      text("🍲 " + st.dish, bx, by + 4, { size: 11, align: "center", color: "#ffffff" });
    } else {
      text("[E] Để Nấu", bx, by + 4, { size: 10, align: "center", color: "rgba(255,255,255,0.7)" });
    }

    if (isCooking && st.cook_ticks_left !== undefined) {
      text(`⏱ Còn ${Math.ceil(st.cook_ticks_left / 60)}s`, bx, by + bw * 0.75, { size: 11, align: "center", color: "#ffeb3b" });
    }
  });

  // Bàn ăn T1..T4 & Khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));

  (snap.tables || []).forEach((tb) => {
    const tx = sx(tb.pos[0]), ty = sy(tb.pos[1]);
    const r = 0.95 * s;

    // Vẽ 4 ghế đẩu xung quanh bàn
    const stoolDist = r * 1.35;
    const stoolRadius = 0.28 * s;
    const stoolAngles = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2];
    stoolAngles.forEach(ang => {
      const gx = tx + Math.cos(ang) * stoolDist;
      const gy = ty + Math.sin(ang) * stoolDist;
      ctx.fillStyle = highContrast ? "#444" : "#a1887f";
      ctx.beginPath(); ctx.arc(gx, gy, stoolRadius, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1; ctx.stroke();
    });

    // Mặt bàn gỗ tròn
    ctx.fillStyle = highContrast ? "#222" : "#8d6e63";
    ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke();

    // Khăn trải bàn nhỏ / đĩa giữa bàn
    ctx.fillStyle = highContrast ? "#333" : "#efebe9";
    ctx.beginPath(); ctx.arc(tx, ty, r * 0.45, 0, Math.PI * 2); ctx.fill();

    // Tên bàn
    const tableNum = tb.id.replace("T", "BÀN ");
    text(tableNum, tx, ty + 4, { size: 11, align: "center", color: highContrast ? "#fff" : "#3e2723" });

    const c = byTable[tb.id];
    if (c) {
      // Có thực khách ngồi tại bàn (ghế phía trên)
      const cx = tx, cy = ty - 1.55 * s;
      const isEating = c.state === "eating";

      // Vẽ avatar thực khách miền Tây
      ctx.fillStyle = isEating ? "#43a047" : "#ec407a";
      ctx.beginPath(); ctx.arc(cx, cy, 0.65 * s, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
      // Mũ / nón thực khách
      ctx.fillStyle = "#ffe082";
      ctx.beginPath(); ctx.arc(cx, cy - 0.2 * s, 0.5 * s, Math.PI, 0); ctx.fill();

      // Bong bóng gọi món
      const bubbleY = cy - 1.1 * s;
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(cx - 55, bubbleY - 10, 110, 20);
      ctx.strokeStyle = isEating ? "#81c784" : "#f48fb1"; ctx.lineWidth = 1;
      ctx.strokeRect(cx - 55, bubbleY - 10, 110, 20);
      text(isEating ? "😋 Đang ăn: " + c.dish_id : "🍽 Gọi: " + c.dish_id, cx, bubbleY + 4, { size: 10, align: "center", color: "#fff" });

      // Thanh kiên nhẫn
      if (c.patience_ticks_left !== undefined && !isEating) {
        const ratio = Math.max(0, c.patience_ticks_left / patMax);
        const col = ratio > 0.5 ? "#4caf50" : ratio > 0.25 ? "#ffa726" : "#f44336";
        bar(cx - 0.9 * s, cy + 0.8 * s, 1.8 * s, 6, ratio, col);
      }
    } else {
      text("(Trống)", tx, ty + r * 0.78, { size: 9, align: "center", color: "rgba(255,255,255,0.7)" });
    }
  });

  // Người chơi Út Sen
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    drawUtSen(px, py, 0, s, false, false);
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 ĐANG CẦM: " + hand, px, py - 1.05 * s, { size: 12, align: "center", color: "#76ff03" });
    }
  }

  // Cảnh báo 3: Khách sắp giận
  const angryCust = (snap.customers || []).find(c => c.state === "waiting" && c.patience_ticks_left !== undefined && c.patience_ticks_left <= 0.25 * patMax);
  if (angryCust) {
    const isBlink = Math.floor(Date.now() / 200) % 2 === 0;
    ctx.fillStyle = isBlink ? "#d50000" : "#ff1744"; ctx.fillRect(w / 2 - 230, 8, 460, 32);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - 230, 8, 460, 32);
    text(`😡 CẢNH BÁO: KHÁCH ${angryCust.table_id.replace("T", "BÀN ")} SẮP BỎ VỀ (${Math.ceil(angryCust.patience_ticks_left / 60)}s)!`, w / 2, 30, { size: 13, align: "center", color: "#fff" });
  }

  // Banner hướng dẫn khi kho trống không có nguyên liệu
  const freshStockCount = (snap.stock || []).filter(it => (typeof it === "object" ? it.fresh >= 30 : true)).length;
  if (freshStockCount === 0) {
    ctx.fillStyle = "rgba(183, 28, 28, 0.9)";
    ctx.fillRect(w / 2 - 280, h / 2 - 35, 560, 70);
    ctx.strokeStyle = "#ffeb3b"; ctx.lineWidth = 2;
    ctx.strokeRect(w / 2 - 280, h / 2 - 35, 560, 70);
    text("⚠️ KHO ĐANG HẾT NGUYÊN LIỆU TƯƠI!", w / 2, h / 2 - 12, { size: 14, align: "center", color: "#ffeb3b" });
    text("Khách chỉ vào quán khi có nguyên liệu để nấu món.", w / 2, h / 2 + 8, { size: 12, align: "center", color: "#ffffff" });
    text("👉 Chơi Ca Sáng (Gather) để hái hoa, bắt cá mang về quán!", w / 2, h / 2 + 25, { size: 11, align: "center", color: "#80d8ff" });
  }

  // Dòng hướng dẫn thao tác nhanh ở chân màn hình
  ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
  ctx.fillRect(10, h - 30, w - 20, 24);
  text("💡 QUY TRÌNH QUÁN: Khách ngồi bàn gọi món ➜ Đến gần Bếp B1/B2 bấm [E] để nấu ➜ Bếp chín bấm [E] lấy món ➜ Đến Bàn khách bấm [E] phục vụ ➜ Nhận tiền & Uy tín!", w / 2, h - 14, { size: 11, align: "center", color: "#ffe082" });

  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`💰 Tiền: ${snap.money ?? 0}k · ⭐ Uy tín: ${(snap.reputation ?? 0).toFixed(1)}/5.0 · 🏆 Điểm: ${snap.score ?? 0}`, 110, 28, { size: 16 });
  let stockStr = "";
  if (Array.isArray(snap.stock)) {
    stockStr = snap.stock.map(it => {
      const isSpoiled = it.fresh < 30;
      return `${KIND_NAME[it.kind] || it.kind}${isSpoiled ? " [ƯƠN]" : ` [${Math.round(it.fresh)}%]`}`;
    }).join(", ");
  }
  text("Kho nguyên liệu: " + (stockStr || "(trống)"), 14, 52, { size: 13, color: highContrast ? "#00ffff" : "#cfd8dc" });
}

// ----- Ca Đêm: Tiệm Tạp Hóa (SHOP) -----
function drawShop(w, h) {
  text("🏪 TIỆM TẠP HÓA ÚT SEN — NÂNG CẤP CUỐI NGÀY", w / 2, 80, { size: 22, align: "center", color: "#fbc02d" });
  text(`Tiền: ${snap.money ?? 0} k  ·  Tổng thu: ${snap.earned ?? 0} k  ·  Uy tín: ${(snap.reputation ?? 0).toFixed(1)}/5.0`, w / 2, 120, { size: 16, align: "center" });

  const oxyLvl = snap.upgrades ? (snap.upgrades.oxygen || 0) : 0;
  const hpLvl = snap.upgrades ? (snap.upgrades.hp || 0) : 0;

  ctx.fillStyle = "rgba(255,255,255,0.06)";
  ctx.fillRect(w / 2 - 250, 160, 500, 80);
  ctx.strokeStyle = "rgba(255,255,255,0.2)";
  ctx.strokeRect(w / 2 - 250, 160, 500, 80);
  text(`1. Bình Oxy lặn — Cấp hiện tại: ${oxyLvl} / 2`, w / 2 - 230, 190, { size: 16 });
  text(`[Phím 1] Nâng cấp: ${oxyLvl === 0 ? "200 k (nâng lên 45s)" : (oxyLvl === 1 ? "400 k (nâng lên 60s)" : "ĐÃ TỐI ĐA")}`, w / 2 - 230, 220, { size: 13, color: oxyLvl < 2 ? "#80d8ff" : "#888" });

  ctx.fillRect(w / 2 - 250, 260, 500, 80);
  ctx.strokeRect(w / 2 - 250, 260, 500, 80);
  text(`2. Áo phao (Máu) — Cấp hiện tại: ${hpLvl} / 2`, w / 2 - 230, 290, { size: 16 });
  text(`[Phím 2] Nâng cấp: ${hpLvl === 0 ? "250 k (nâng lên 4 Máu)" : (hpLvl === 1 ? "500 k (nâng lên 5 Máu)" : "ĐÃ TỐI ĐA")}`, w / 2 - 230, 320, { size: 13, color: hpLvl < 2 ? "#ff80ab" : "#888" });

  text(`⏱ Thời gian chọn: ${fmtTime(snap.time_left_ticks)}`, w / 2, 380, { size: 15, align: "center" });
  text("👉 Bấm phím [O] để đóng Shop và sang ngày tiếp theo!", w / 2, 420, { size: 16, align: "center", color: "#69f0ae" });
}

// Bảng trợ giúp phím tắt
function drawHelpModal(w, h) {
  if (!showHelp) return;
  ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(w / 2 - 220, h / 2 - 160, 440, 320);
  ctx.strokeStyle = "#fbc02d"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - 220, h / 2 - 160, 440, 320);
  text("📖 HƯỚNG DẪN ĐIỀU KHIỂN & MẸO CHƠI", w / 2, h / 2 - 130, { size: 16, align: "center", color: "#fbc02d" });
  const tips = [
    "• WASD / Mũi tên: Bơi lặn (ngang & sâu) / Đi lại trong quán",
    "• E: Hái hoa ven bờ, Cập bến tàu [2, 0], Nấu bếp, Phục vụ bàn",
    "• Phím Cách (Space): Bắt đàn cá dưới nước (hồi chiêu 0.5s)",
    "• C: Bật / Tắt chế độ tương phản cao (High Contrast)",
    "• M: Bật / Tắt âm thanh & nhạc nền",
    "• 1, 2: Mua bình oxy và áo phao trong Shop",
    "• O: Đóng Shop sang ngày mới",
    "• P / Esc: Tạm dừng / Tiếp tục mô phỏng",
    "• R: Chơi lại từ đầu"
  ];
  tips.forEach((t, i) => text(t, w / 2 - 200, h / 2 - 95 + i * 22, { size: 12, color: "#e0e0e0" }));
  text("Bấm phím [H] để đóng bảng này", w / 2, h / 2 + 135, { size: 12, align: "center", color: "#90caf9" });
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = highContrast ? "#000000" : "#0c1218";
  ctx.fillRect(0, 0, w, h);

  if (snap) {
    const phase = snap.phase || snap.mode;
    if (phase === "quan") drawQuan(w, h);
    else if (phase === "shop") drawShop(w, h);
    else drawGather(w, h);

    // Cập nhật và vẽ hạt
    for (let i = particles.length - 1; i >= 0; i--) {
      particles[i].update();
      particles[i].draw(ctx);
      if (particles[i].life <= 0) particles.splice(i, 1);
    }

    // Top Bar HUD Nút Bấm
    // 1. Tương phản cao
    ctx.fillStyle = highContrast ? "#ffff00" : "rgba(255,255,255,.12)"; ctx.fillRect(w - 170, 10, 160, 26);
    ctx.strokeStyle = "#fff"; ctx.strokeRect(w - 170, 10, 160, 26);
    text(highContrast ? "👁 Tương phản: BẬT" : "👁 Tương phản: TẮT", w - 90, 27, { size: 11, align: "center", color: highContrast ? "#000" : "#fff" });

    // 2. Âm thanh
    ctx.fillStyle = audioEnabled ? "rgba(76, 175, 80, 0.3)" : "rgba(244, 67, 54, 0.3)"; ctx.fillRect(w - 310, 10, 130, 26);
    ctx.strokeStyle = "#fff"; ctx.strokeRect(w - 310, 10, 130, 26);
    text(audioEnabled ? "🔊 Âm thanh: BẬT" : "🔇 Âm thanh: TẮT", w - 245, 27, { size: 11, align: "center", color: "#fff" });

    // 3. Bảng xếp hạng
    ctx.fillStyle = "rgba(255, 193, 7, 0.25)"; ctx.fillRect(w - 460, 10, 140, 26);
    ctx.strokeStyle = "#fbc02d"; ctx.strokeRect(w - 460, 10, 140, 26);
    text("🏆 Xếp Hạng", w - 390, 27, { size: 11, align: "center", color: "#ffd54f" });

    // 4. Trợ giúp
    ctx.fillStyle = "rgba(33, 150, 243, 0.25)"; ctx.fillRect(w - 540, 10, 70, 26);
    ctx.strokeStyle = "#90caf9"; ctx.strokeRect(w - 540, 10, 70, 26);
    text("❓ Giúp", w - 505, 27, { size: 11, align: "center", color: "#90caf9" });

    // Nhật ký sự kiện góc dưới phải
    const ev = (snap.events || []).slice(-4);
    ev.forEach((e, i) => text(`t${e.tick} ${e.name} ${brief(e.data)}`, w - 10, h - 50 - (ev.length - 1 - i) * 16, { size: 11, align: "right", color: "rgba(255,255,255,.6)" }));

    // Bảng kết thúc ngày / kết thúc game
    if (snap.finished) {
      ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(w / 2 - 220, h / 2 - 70, 440, 140);
      ctx.strokeStyle = "#fbc02d"; ctx.lineWidth = 2; ctx.strokeRect(w / 2 - 220, h / 2 - 70, 440, 140);
      const title = snap.score >= 500 ? "🌟 VUA ĐẦU BẾP CHỢ NỔI" : snap.score >= 300 ? "🐟 KÌNH NGƯ SÔNG TIỀN" : "🛶 TAY CHÈO TIỀM NĂNG";
      text(title, w / 2, h / 2 - 35, { size: 18, align: "center", color: "#fbc02d" });
      text(`Hoàn thành: ${snap.reason || ""}  ·  Tổng điểm: ${snap.score ?? 0}`, w / 2, h / 2 - 5, { size: 14, align: "center" });
      text("Nhấn [R] để chơi lại lượt mới", w / 2, h / 2 + 35, { size: 13, align: "center", color: "#90caf9" });
    }

    drawHelpModal(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ sim..." : "Đang kết nối...", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
